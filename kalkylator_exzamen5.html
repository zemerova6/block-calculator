<HTML>
<HEAD>
	<TITLE>AeroBlock</TITLE>
	<META charset='UTF-8'>
	<LINK REL='STYLESHEET' HREF='style.css'>
	<script src='script.js'></script>
</HEAD>
<BODY>
	<HEADER>
		<H1><a name="AeroBlock">AeroBlock</a></H1>
		<NAV>
			<A HREF='index.HTML#AeroBlock'>Главная</A>
			<A HREF='kalkylator_exzamen2.HTML#AeroBlock'>О компании</A>
			<A HREF='kalkylator_exzamen5.HTML#AeroBlock'>Калькулятор</A>
		</NAV>
	</HEADER>
	<table>
		<tr>
			<td><p class=p3>Вид блока</p></td>
			<td>
				<select id='type'>
				<option value='0.018'>Малый: 600ммx300ммx100мм</option>
				<option value='0.036'>Средний: 600ммx300ммx200мм</option>
				<option value='0.072'>Крупный: 600ммx300ммx400мм</option>
				</select>
			</td>
			
		</tr>
		<tr>
			<td><p class=p3>Длина, м</p></td>
			<td>
				<input type='text' id='length' value=''>
			</td>
			<td class=TD3 rowspan=3>
				<div class="rectangle-1">
					<img CLASS=IMG1 src='11.PNG'>
					<h4>Результат вычислений:</h4>
					<h5><div id='rez'></div></h5>
				</div>
			</td>
		</tr>
		<tr>
			<td><p class=p3>Ширина, м</p></td>
			<td>
				<input type='text' id='width' value=''>
			</td>
		</tr>
		<tr>
			<td><p class=p3>Высота, м</p></td>
			<td>
				<input type='text' id='height' value=''>
			</td>
			
		</tr>
		<tr>
			<td><p class=p3>Площадь всех дверей, м<sup>2</sup></p></td>
			<td>
				<input type='text' id='doors' value=''>
			</td>
		</tr>
		<tr>
			<td><p class=p3>Площадь всех окон, м<sup>2</sup></p></td>
			<td>
				<input type='text' id='windows' value=''>
			</td>
		</tr>
		<tr>
			<td><p class=p3>Рассчитать кратно поддонам</p></td>
			<td>
				<input type="checkbox" class=checkbox id='checkbox'>
				<label for='checkbox'></label>
			</td>
			<td><button onclick='cal()'>Рассчитать</button></td>
		</tr>
	</table>
</BODY>
</HTML>
